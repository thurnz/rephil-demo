<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="diagonal-stripes" width="40" height="40" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#1d3557" stroke-width="12" />
      <line x1="20" y1="0" x2="20" y2="40" stroke="#172b4d" stroke-width="12" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#132448" />
  <rect width="800" height="600" fill="url(#diagonal-stripes)" opacity="0.35" />
  <g transform="translate(400, 280)" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    <text y="0" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="1">Hero photo</text>
    <text y="42" font-size="20" font-weight="400" fill="#cbd5e1" opacity="0.85">Mascot or tricycle at a Rephil station</text>
  </g>
</svg>